## Local PostgreSQL for `bun run --cwd packages/backend test`.
##
##   docker compose -f docker-compose.postgres.yml up -d --wait
##   export TEST_DATABASE_URL=postgres://moovo:moovo@127.0.0.1:5437/postgres
##
## `TEST_DATABASE_URL` points at `postgres`, the ADMIN database, because that is
## where each test file's throwaway database is CREATED — it is not the database
## any suite connects to. `db/testDatabase.ts` creates `oxydb_test_<hex>`,
## migrates it, hands the suite a handle to that, and drops it afterwards.
##
## Port 5437 rather than the default: every Oxy backend keeps a dev server on
## this machine and they cannot share one. 5432-5436, 5438 and 5439 are taken by
## the other apps, so a default port here would connect a Moovo suite to some
## other product's database and read as a schema error.
##
## `postgis/postgis`, NOT plain `postgres:17-alpine`, and pinned on BOTH versions.
## Measured rather than assumed: courier dispatch runs `$nearSphere` and listing
## search runs `$near`, so those become `geography` columns with GiST indexes and
## the migrator declares `postgis` as a required extension.
##
## The image is only half of it. A new database is cloned from `template1`, which
## the image never seeds, so `CREATE EXTENSION` still has to run per database —
## which is what `db/migrate.ts` declares and `@oxyhq/db` performs here. On RDS
## that same statement needs the MASTER user: postgis is not a trusted extension,
## so the owning role cannot install it.
##
## A floating PostGIS minor is a floating set of function volatilities, which a
## generated column and its index depend on — hence both versions pinned.
services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: moovo-postgres-dev
    environment:
      POSTGRES_USER: moovo
      POSTGRES_PASSWORD: moovo
      POSTGRES_DB: moovo
    ports:
      - '127.0.0.1:5437:5432'
    healthcheck:
      # `pg_isready` rather than a sleep, and `--wait` on the compose command:
      # a suite that starts before the server accepts connections fails as a
      # connection error, which reads like a broken harness rather than a
      # container that was not up yet.
      test: ['CMD-SHELL', 'pg_isready -U moovo']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      # Throwaway by construction: a test database that survives a restart is a
      # test database that can carry a previous run's rows into this one.
      - /var/lib/postgresql/data
