name: Deploy Moovo Go

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare-go.yml'
      - 'packages/courier-app/**'
      - 'shared/**'
      - 'package.json'
      - 'bun.lock'

# One deploy to the `moovo-go` Pages project at a time, and never cancel one in
# flight: a `wrangler pages deploy` cut off half-way is worse than a late one.
# A newer pending run may replace an older pending one, which is safe because
# it builds main's newer tree.
concurrency:
  group: deploy-cloudflare-moovo-go
  cancel-in-progress: false

# Cloudflare is reached with its own API token; the GitHub token only needs to
# read the repository.
permissions:
  contents: read

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    # The web export alone is allowed 60 minutes below; the rest takes minutes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: Build app (Expo web export)
        run: bun run build:courier
        timeout-minutes: 60
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
          # Public, compile-time Expo env. EXPO_PUBLIC_OXY_CLIENT_ID is the
          # registered Oxy RP client id (handoff: register it and set this repo
          # variable before the SSO RP flow works); the API URL points at the
          # Moovo backend.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.EXPO_PUBLIC_OXY_CLIENT_ID }}
          EXPO_PUBLIC_OXY_API_URL: ${{ vars.EXPO_PUBLIC_OXY_API_URL || 'https://api.oxy.so' }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://api.moovo.now' }}
      # `bunx wrangler@4` DIRECTLY, never `cloudflare/wrangler-action` — the
      # action is forbidden fleet-wide (Oxy docs/infra-and-deploys.md). It
      # installs its own wrangler into the working tree mid-deploy, and that
      # install fails intermittently with `error: Fail extracting tarball for
      # "wrangler"`, publishing nothing (Peable run 35019486292, Homiio,
      # Clarity). Pinned to a major so a new wrangler major cannot change the
      # deploy path with no diff to show for it. Credentials come from the
      # environment, which is where wrangler reads them.
      - name: Deploy to Cloudflare Pages
        run: bunx wrangler@4 pages deploy packages/courier-app/dist --project-name=moovo-go --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
