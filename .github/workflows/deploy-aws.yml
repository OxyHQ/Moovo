# AWS deploy workflow for the Moovo API.
# Builds the linux/arm64 backend image, pushes it to ECR, and forces a new ECS
# deployment. AWS access is via the OIDC role oxy-github-deploy — no stored keys.
#
# NOTE (handoff): the ECS service `moovo`, its task definition, ALB
# listener rule, ECR repo, and SSM parameter wiring do NOT exist yet. They live
# in oxy-infra (terraform-uswest2/) and must be provisioned there before this
# workflow can deploy. Until then this builds + pushes the image and skips the
# ECS step (the service-existence guard below handles that gracefully).
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: moovo
  CLUSTER: oxy-cluster
  DOCKERFILE: Dockerfile

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run --filter @moovo/backend lint

      - run: bun run --filter @moovo/backend test

      - run: bun run build:backend

  deploy:
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # The secrets are enumerated one at a time, on purpose.
      #
      # This step used to expand the entire `secrets` context with
      # `toJSON(secrets)`, and that is what holds deploys. A workflow that walks
      # every repository secret into a shell loop is shaped exactly like an
      # exfiltration payload, so GitHub creates the run with conclusion
      # `action_required` and ZERO jobs until a human clicks "Approve and run"
      # in the UI. The REST approve endpoint only serves fork pull requests, so
      # it cannot be automated, and the approval is per run — every deploy needs
      # a person.
      #
      # Enumerating is also least privilege. The old loop copied every secret
      # visible to the repo, so the org-wide CI credentials (NPM_TOKEN,
      # CLOUDFLARE_API_TOKEN, ADD_TO_PROJECT_TOKEN) ended up in this app's SSM
      # namespace, and this repo could overwrite the /oxy/_shared/* parameters
      # that other services read.
      #
      # The list is the secrets the `moovo` task definition actually consumes.
      # Adding a new one means adding it here, or it never reaches SSM.
      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        env:
          APP_MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SHARED_REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          sync_secret() {
            name="$1"; value="$2"; path="$3"
            if [ -z "$value" ] || [ "$value" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $name; SSM unchanged"
              return 0
            fi
            aws ssm put-parameter --name "$path" --value "$value" --type SecureString --overwrite >/dev/null
            echo "synced -> $path"
          }

          sync_secret MONGODB_URI "$APP_MONGODB_URI" "/oxy/$APP/MONGODB_URI"

          # Valkey lives in the cluster's region; a URL from another region
          # leaves the service silently without a cache, so it is rejected.
          if [ -n "$SHARED_REDIS_URL" ] && [ "$SHARED_REDIS_URL" != "-" ] &&
             ! printf '%s' "$SHARED_REDIS_URL" | grep -q '\.usw2\.cache\.amazonaws\.com'; then
            echo "::warning::skip REDIS_URL because it does not point at the us-west-2 Valkey endpoint; SSM unchanged"
          else
            sync_secret REDIS_URL "$SHARED_REDIS_URL" "/oxy/_shared/REDIS_URL"
          fi

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP-backend \
            --cache-to type=gha,scope=$APP-backend,mode=max \
            -f "$DOCKERFILE" \
            -t "$IMG:${{ github.sha }}" \
            -t "$IMG:latest" \
            --push \
            .

      - name: Deploy to ECS (rolling; skipped until the service exists)
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" = "ACTIVE" ]; then
            aws ecs update-service --cluster "$CLUSTER" --service "$APP" --force-new-deployment >/dev/null
            aws ecs wait services-stable --cluster "$CLUSTER" --services "$APP"
            echo "deployed $APP"
          else
            echo "ECS service $APP not created yet — image is in ECR, skipping deploy"
          fi
