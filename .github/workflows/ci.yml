name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request supersedes its previous run. A push to `main`
# never cancels anything: each `main` commit gets its own group (keyed on the
# sha), because a shared group also replaces a PENDING run, and a cancelled run
# on `main` is the only post-merge evidence that commit would ever have had.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Pull requests only run the jobs whose inputs they touch; the org shares one
  # 20-job Actions concurrency cap across every repository. Anything that is
  # not a pull request (push to main, workflow_dispatch) skips this job, and a
  # skipped `changes` makes every job below run. Shared inputs mark everything
  # affected: the lockfile, any manifest, shared-types, the root config and
  # this workflow itself.
  changes:
    name: Detect affected packages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.shared == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.shared == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared:
              - '.github/**'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'package.json'
              - 'packages/*/package.json'
              - 'shared/**'
              - 'packages/shared-types/**'
              - 'packages/contracts/**'
              - 'packages/sdk/**'
              - 'tsconfig*.json'
              - 'app.json'
              - 'scripts/**'
            backend:
              - 'packages/backend/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.postgres.yml'
            frontend:
              - 'packages/app-shell/**'
              - 'packages/frontend/**'
              - 'packages/courier-app/**'
              - 'packages/fleet-dashboard/**'
              - 'packages/tracker-app/**'

  # The Seldon race (OxyHQ/oxy docs/engineering/build-and-deploy.md, CI on
  # Seldon), opt-in with the repository variable CI_SELDON_RACE=true, on
  # same-repository pull requests (and merge_group, should this workflow ever
  # gain it) only: push and dispatch runs stay hosted, because the deploys
  # trust a push run that concluded `success`. Unset, every job runs hosted as
  # before and none of these takes a runner. Set, the heavy jobs (Lint & Test,
  # API image smoke, Build App) run on the self-hosted seldon-ci pool; a lane
  # still queued 3 minutes after it was created gets its hosted twin (the
  # `-hosted` jobs), the lane that starts first wins and the finish job cancels
  # the other through its job-level concurrency group. A Seldon lane that fails,
  # whatever the reason (the house network drops new connections in bursts),
  # reruns hosted in its `-rescue` job, which fails again on a genuine failure.
  # CI complete takes the raced jobs' verdict from the race.
  race:
    needs: changes
    if: ${{ !cancelled() && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-start.yml@main
    permissions:
      actions: read
    with:
      names: |
        Lint & Test
        API image smoke (Bun)
        Build App

  race-finish:
    needs: race
    # `!cancelled()`: an ancestor skipped on this event must not skip it.
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-finish.yml@main
    permissions:
      actions: read
    with:
      names: |
        Lint & Test
        API image smoke (Bun)
        Build App

  # Biome formats and lints the WHOLE repository (every package, root scripts
  # and config) in one pass of a few seconds, so this job is not gated on the
  # `changes` filter: a frontend-only pull request must be linted too.
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check transport OpenAPI freshness
        run: bun scripts/transport-openapi.mjs

      - name: Biome
        run: bunx biome ci .

      # The production image's build inputs (Dockerfile, context, target and
      # both .dockerignore files) must match the one reviewed pin in
      # .github/scripts/reviewed-images.json. The deploy refuses to build on a
      # mismatch, so catching it here is what stops a merge from stranding
      # main undeployable. The fixture tests run first so a green check means
      # the gate can fail, not that it stopped looking.
      - name: Prove the reviewed-image gate can fail
        run: python3 -B -m unittest discover -s .github/scripts -p test_reviewed_image.py
      - name: Verify the production image's build inputs are reviewed
        run: python3 -B .github/scripts/reviewed-image.py check

  lint-and-test:
    name: Lint & Test
    needs: changes
    if: ${{ !cancelled() && !failure() && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: &seldon-lane ${{ vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && 'seldon-ci' || 'ubuntu-latest' }}
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-Lint & Test
    permissions: &race-lane-permissions
      contents: read
      actions: read # the Seldon race guard reads this run's jobs
    timeout-minutes: 15

    steps: &lint-and-test-steps
      # A lane that starts after its hosted twin waits here to be cancelled (the Seldon race).
      - &race-guard
        name: Seldon race guard
        if: vars.CI_SELDON_RACE == 'true' && !endsWith(github.job, '-rescue')
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: guard
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Oxy dependency health
        run: bun run doctor:oxy

      # Translation keys follow ADR 0055: nested identifier segments under a
      # namespace, and no key in a translation that English lacks.
      - name: Translation key convention
        run: bun run i18n:check

      # The real-DB transport suite drives the API through the workspace SDK,
      # whose types resolve to its (gitignored) dist.
      - name: Build SDK
        run: bun run build:sdk

      # The published contracts and SDK: what gates their npm release, which
      # runs no tests of its own.
      - name: Typecheck contracts and SDK, test SDK
        run: |
          bun run --filter @oxy.so/moovo-contracts typecheck
          bun run --filter @oxy.so/moovo-sdk typecheck
          bun run --filter @oxy.so/moovo-sdk test

      - name: Typecheck API
        run: bun run --filter @moovo/backend typecheck

      # Every Oxy app shares one Postgres: a new migration may not hold a lock
      # that stalls a hot table (NOT VALID constraints validated later, hot-table
      # DDL alone in its migration). The rules are @oxy.so/db's; the baseline and
      # hot tables are in packages/backend's db:check-locks script.
      - name: Verify every new migration keeps its locks short
        run: bun run --cwd packages/backend db:check-locks

      # Started from the SAME compose file a developer uses, deliberately, rather
      # than from a `services:` block: a `services:` block would restate the
      # image pin, giving CI and a developer two places to disagree about the
      # version under test. `--wait` rather than a sleep, because the compose
      # file carries a `pg_isready` healthcheck and a suite that starts before
      # the server accepts connections fails as a connection error — which reads
      # like a broken harness rather than a container that was not up yet.
      - name: Start PostgreSQL
        run: docker compose -f docker-compose.postgres.yml up -d --wait postgres

      - name: Run API tests
        # TEST_DATABASE_URL names the ADMIN database: each test file creates its
        # own throwaway database on that server and drops it afterwards.
        #
        # MOOVO_REQUIRE_POSTGRES_TESTS turns "skip when unavailable" into a hard
        # failure here. Skipping is right on a laptop with no container up and
        # wrong in CI, where a skipped suite and a passing suite are the same
        # colour. The assertion lives in the suite rather than in a grep over
        # this step's output — measured: vitest prints a per-file line only for
        # FAILING files, so a grep for the harness file finds nothing exactly
        # when everything passed.
        env:
          TEST_DATABASE_URL: postgres://moovo:moovo@127.0.0.1:5437/postgres
          MOOVO_REQUIRE_POSTGRES_TESTS: '1'
        run: bun run --filter @moovo/backend test

      # Production runs the API on Bun (Dockerfile runner stage), so the unit
      # suite also runs under Bun's runtime and test runner, not only under
      # vitest on Node. Left on vitest only: the *.realdb suites (they hang
      # under `bun test`; the image smoke below covers Postgres under Bun) and
      # three files that re-evaluate modules with `vi.resetModules`/`vi.doMock`,
      # which bun:test cannot reproduce. Those are runner differences, not
      # runtime ones; see the `test:bun` script.
      - name: Run API unit tests under Bun
        run: bun run --filter @moovo/backend test:bun

      # Builds the API and EXECUTES the built artefacts under bun, the image's
      # runtime: each failure scenario must exit non-zero (ECS and the deploy
      # read nothing but exit codes), and a real boot, /health/ready and SIGTERM
      # must end in exit 0. The compose server's `moovo` database has PostGIS.
      - name: Check built API entrypoints under Bun
        env:
          MOOVO_ENTRYPOINT_DATABASE_URL: postgres://moovo:moovo@127.0.0.1:5437/moovo
        run: bun run check:api-entrypoints

  # lint-and-test's hosted twin in the Seldon race: the same name and steps.
  lint-and-test-hosted:
    name: Lint & Test
    needs: [changes, race]
    if: ${{ !cancelled() && !failure() && needs.race.outputs.race == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-Lint & Test
    permissions: *race-lane-permissions
    steps: *lint-and-test-steps

  # lint-and-test's rescue: reruns it hosted when its Seldon lane failed (the
  # house network drops connections); a genuine failure fails again.
  lint-and-test-rescue:
    name: Lint & Test
    needs: [changes, lint-and-test]
    if: ${{ !cancelled() && needs.lint-and-test.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: *race-lane-permissions
    steps: *lint-and-test-steps

  # The image as ECS runs it: built from the real Dockerfile and booted against
  # Postgres. Bun as PID 1, both migrator phases with the deploy's command, a
  # workload-identity token minted with the production @oxy.so/core, a 200 from
  # /health/ready and a graceful exit 0 on SIGTERM.
  #
  # linux/amd64, while production is linux/arm64: the database must be the
  # compose file's postgis/postgis image (the migrator requires PostGIS), which
  # publishes amd64 only. The deploy builds the arm64 image from the same
  # Dockerfile, and both architectures use the same oven/bun alpine (musl) base.
  api-image-smoke:
    name: API image smoke (Bun)
    needs: changes
    if: ${{ !cancelled() && !failure() && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: *seldon-lane
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-API image smoke (Bun)
    permissions: *race-lane-permissions
    timeout-minutes: 20

    steps: &api-image-smoke-steps
      - *race-guard
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start PostgreSQL
        run: docker compose -f docker-compose.postgres.yml up -d --wait postgres

      # BuildKit layer cache, READ on every run and WRITTEN only by a push to
      # main, so a pull request can never seed what main (or another pull
      # request) builds from. Its own amd64 scope: the deploy's `moovo-backend`
      # scope holds linux/arm64 layers, which an amd64 build cannot reuse.
      # `--load` keeps the image in the local daemon for the smoke below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `type=gha` needs the Actions runtime token and cache URL, which GitHub
      # gives to JavaScript actions and NOT to `run:` steps; without them buildx
      # skips the cache silently.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build the API image
        env:
          WRITE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          cache=(--cache-from type=gha,scope=moovo-backend-amd64)
          if [ "$WRITE_CACHE" = true ]; then
            cache+=(--cache-to type=gha,scope=moovo-backend-amd64,mode=max)
          fi
          docker buildx build --load "${cache[@]}" -t moovo-api:ci .

      - name: Smoke the API image under its Bun runtime
        env:
          IMAGE: moovo-api:ci
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          DATABASE_URL: postgres://moovo:moovo@127.0.0.1:5437/moovo
        run: bash .github/scripts/smoke-api-image.sh

  # api-image-smoke's hosted twin in the Seldon race: the same name and steps.
  api-image-smoke-hosted:
    name: API image smoke (Bun)
    needs: [changes, race]
    if: ${{ !cancelled() && !failure() && needs.race.outputs.race == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-API image smoke (Bun)
    permissions: *race-lane-permissions
    steps: *api-image-smoke-steps

  # api-image-smoke's rescue: reruns it hosted when its Seldon lane failed (the
  # house network drops connections); a genuine failure fails again.
  api-image-smoke-rescue:
    name: API image smoke (Bun)
    needs: [changes, api-image-smoke]
    if: ${{ !cancelled() && needs.api-image-smoke.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: *race-lane-permissions
    steps: *api-image-smoke-steps

  build-api:
    name: Build API
    needs: changes
    if: ${{ !cancelled() && !failure() && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No cache for ~/.bun/install/cache, deliberately. Measured on #111
      # (runs 36715141012, 36720741457, 36721889380): a warm restore took
      # 7-9s plus a 3-5s install, and a save took up to 8s, against a plain
      # install of 5-14s. It never paid for itself, and each save spends
      # the repo's 10 GB Actions cache budget.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build API
        run: bun run build:backend

  build-app:
    name: Build App
    needs: changes
    if: ${{ !cancelled() && !failure() && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true') }}
    runs-on: *seldon-lane
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-Build App
    permissions: *race-lane-permissions
    timeout-minutes: 30

    steps: &build-app-steps
      - *race-guard
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build App (Expo web export)
        run: bun run build:frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production

  # build-app's hosted twin in the Seldon race: the same name and steps.
  build-app-hosted:
    name: Build App
    needs: [changes, race]
    if: ${{ !cancelled() && !failure() && needs.race.outputs.race == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-Build App
    permissions: *race-lane-permissions
    steps: *build-app-steps

  # build-app's rescue: reruns it hosted when its Seldon lane failed (the house
  # network drops connections); a genuine failure fails again.
  build-app-rescue:
    name: Build App
    needs: [changes, build-app]
    if: ${{ !cancelled() && needs.build-app.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: *race-lane-permissions
    steps: *build-app-steps

  # The one check this workflow stands for, modelled on OxyHQ/Bloom's and
  # OxyHQ/Gemies': green only when every job above passed or skipped for a
  # reason this workflow declares, so a cancelled or unexplained-skipped job can
  # never read as a pass. Required checks by job name cannot follow the Seldon
  # race (a twin and a rescue share their job's name, and a cancelled loser is
  # not a failure); this one can.
  #
  # The skips it allows, and nothing else:
  #   - `changes` runs on pull_request only.
  #   - On pull_request, a job filtered by `changes` skips when its filter said
  #     no (Lint & Test, API image smoke and Build API on `backend`, Build App
  #     on `frontend`).
  #   - The race's jobs, twins and rescues skip whenever they are not needed.
  # When the race or a rescue ran, a raced job passes on the race's verdict:
  # each of its names passed in some lane and failed in no hosted lane.
  ci-complete:
    name: CI complete
    if: always()
    # Not race-finish: its reapers run on seldon-ci-light and only follow the
    # cancellation, so needing it would wait on Seldon.
    needs:
      - changes
      - race
      - lint
      - lint-and-test
      - lint-and-test-hosted
      - lint-and-test-rescue
      - api-image-smoke
      - api-image-smoke-hosted
      - api-image-smoke-rescue
      - build-api
      - build-app
      - build-app-hosted
      - build-app-rescue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the Seldon race verdict reads this run's jobs
    steps:
      # Per job name: passed when one of its lanes succeeded and no hosted lane
      # failed. Whenever the race is on: a rescue can run without the race.
      - name: Seldon race verdict
        id: race
        if: vars.CI_SELDON_RACE == 'true'
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: verdict
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          RACE_VERDICT: ${{ steps.race.outputs.outcome }}
        run: |
          set -euo pipefail
          failures=()
          result() { jq -r --arg job "$1" '.[$job].result // "missing"' <<<"$RESULTS"; }
          said() { jq -r --arg out "$1" '.changes.outputs[$out] // ""' <<<"$RESULTS"; }

          # `changes` runs on pull requests and nowhere else.
          changes="$(result changes)"
          if [ "$EVENT_NAME" = pull_request ]; then
            [ "$changes" = success ] || failures+=("changes did not pass: $changes")
          else
            [ "$changes" = skipped ] || failures+=("changes ran on $EVENT_NAME: $changes")
          fi

          # The race's start: skipped when not needed, never failed.
          r="$(result race)"
          case "$r" in
            success | skipped) ;;
            *) failures+=("race did not pass: $r") ;;
          esac

          # A raced family's result, in $family: the verdict when the race ran
          # (and the job was not skipped) or its rescue ran; otherwise the
          # job's own, with its twin and rescue skipped. Not called in a
          # subshell, so its failures reach the list.
          family() {
            local job="$1" own twin rescue raced
            own="$(result "$job")"
            twin="$(result "$job-hosted")"
            rescue="$(result "$job-rescue")"
            raced="$(jq -r '.race.outputs.race // ""' <<<"$RESULTS")"
            if [ "$rescue" != skipped ] || { [ "$raced" = true ] && ! { [ "$own" = skipped ] && [ "$twin" = skipped ]; }; }; then
              family="${RACE_VERDICT:-no verdict}"
              return
            fi
            [ "$twin" = skipped ] || failures+=("$job-hosted ran although the Seldon race did not: $twin")
            family="$own"
          }

          # job, its `changes` output ('' = never filtered), its result.
          check() {
            local job="$1" filter="$2" r="$3"
            [ "$r" = success ] && return
            if [ "$r" = skipped ] && [ -n "$filter" ] && [ "$EVENT_NAME" = pull_request ] && [ "$changes" = success ] && [ "$(said "$filter")" != true ]; then
              return
            fi
            failures+=("$job did not pass: $r")
          }
          check lint '' "$(result lint)"
          family lint-and-test
          check lint-and-test backend "$family"
          family api-image-smoke
          check api-image-smoke backend "$family"
          check build-api backend "$(result build-api)"
          family build-app
          check build-app frontend "$family"

          if [ ${#failures[@]} -gt 0 ]; then
            for failure in "${failures[@]}"; do
              echo "::error::$failure"
            done
            exit 1
          fi
          echo 'Every job passed, or skipped for a reason this workflow declares.'
