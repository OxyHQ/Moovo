name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The moderation durability tests run against a real MongoDB replica set
      # (mongodb-memory-server), because a mocked model accepts update documents
      # the server rejects. Caching the downloaded mongod keeps that from being a
      # cold network fetch on every run.
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Lint API
        run: bun run --filter @moovo/backend lint

      - name: Typecheck API
        run: bun run --filter @moovo/backend typecheck

      # Started from the SAME compose file a developer uses, deliberately, rather
      # than from a `services:` block: a `services:` block would restate the
      # image pin, giving CI and a developer two places to disagree about the
      # version under test. `--wait` rather than a sleep, because the compose
      # file carries a `pg_isready` healthcheck and a suite that starts before
      # the server accepts connections fails as a connection error — which reads
      # like a broken harness rather than a container that was not up yet.
      - name: Start PostgreSQL
        run: docker compose -f docker-compose.postgres.yml up -d --wait postgres

      - name: Run API tests
        # TEST_DATABASE_URL names the ADMIN database: each test file creates its
        # own throwaway database on that server and drops it afterwards.
        #
        # The skip check runs on THIS run's output rather than in a second step,
        # because a second `bun test` invocation would double the job's time to
        # re-learn something the first run already printed.
        #
        # It matters because a skipped suite and a passing suite are the same
        # colour: the harness suite skips itself when TEST_DATABASE_URL is
        # absent, so a container that failed to start or a renamed variable
        # would leave CI green while nothing was tested against a database.
        env:
          TEST_DATABASE_URL: postgres://moovo:moovo@127.0.0.1:5437/postgres
        run: |
          set -euo pipefail
          bun run --filter @moovo/backend test 2>&1 | tee test-output.txt
          if grep -qE '[0-9]+ skipped' test-output.txt; then
            echo "::error::A suite skipped. The real-database tests must RUN in CI, never skip."
            exit 1
          fi

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build API
        run: bun run build:backend

  build-app:
    name: Build App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build App (Expo web export)
        run: bun run build:frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
