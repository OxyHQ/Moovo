name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request supersedes its previous run. A push to `main`
# never cancels anything: each `main` commit gets its own group (keyed on the
# sha), because a shared group also replaces a PENDING run, and a cancelled run
# on `main` is the only post-merge evidence that commit would ever have had.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Pull requests only run the jobs whose inputs they touch; the org shares one
  # 20-job Actions concurrency cap across every repository. Anything that is
  # not a pull request (push to main, workflow_dispatch) skips this job, and a
  # skipped `changes` makes every job below run. Shared inputs mark everything
  # affected: the lockfile, any manifest, shared-types, the root config and
  # this workflow itself.
  changes:
    name: Detect affected packages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.shared == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.shared == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared:
              - '.github/**'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'package.json'
              - 'packages/*/package.json'
              - 'packages/shared-types/**'
              - 'packages/contracts/**'
              - 'packages/sdk/**'
              - 'vendor/**'
              - 'tsconfig*.json'
              - 'app.json'
              - 'scripts/**'
            backend:
              - 'packages/backend/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.postgres.yml'
            frontend:
              - 'packages/frontend/**'

  # Biome formats and lints the WHOLE repository (every package, root scripts
  # and config) in one pass of a few seconds, so this job is not gated on the
  # `changes` filter: a frontend-only pull request must be linted too.
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check transport OpenAPI freshness
        run: bun scripts/transport-openapi.mjs

      - name: Biome
        run: bunx biome ci .

      # The production image's build inputs (Dockerfile, context, target and
      # both .dockerignore files) must match the one reviewed pin in
      # .github/scripts/reviewed-images.json. The deploy refuses to build on a
      # mismatch, so catching it here is what stops a merge from stranding
      # main undeployable. The fixture tests run first so a green check means
      # the gate can fail, not that it stopped looking.
      - name: Prove the reviewed-image gate can fail
        run: python3 -B -m unittest discover -s .github/scripts -p test_reviewed_image.py
      - name: Verify the production image's build inputs are reviewed
        run: python3 -B .github/scripts/reviewed-image.py check

  lint-and-test:
    name: Lint & Test
    needs: changes
    if: ${{ !cancelled() && !failure() && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Oxy dependency health
        run: bun run doctor:oxy

      - name: Typecheck API
        run: bun run --filter @moovo/backend typecheck

      # Started from the SAME compose file a developer uses, deliberately, rather
      # than from a `services:` block: a `services:` block would restate the
      # image pin, giving CI and a developer two places to disagree about the
      # version under test. `--wait` rather than a sleep, because the compose
      # file carries a `pg_isready` healthcheck and a suite that starts before
      # the server accepts connections fails as a connection error — which reads
      # like a broken harness rather than a container that was not up yet.
      - name: Start PostgreSQL
        run: docker compose -f docker-compose.postgres.yml up -d --wait postgres

      - name: Run API tests
        # TEST_DATABASE_URL names the ADMIN database: each test file creates its
        # own throwaway database on that server and drops it afterwards.
        #
        # MOOVO_REQUIRE_POSTGRES_TESTS turns "skip when unavailable" into a hard
        # failure here. Skipping is right on a laptop with no container up and
        # wrong in CI, where a skipped suite and a passing suite are the same
        # colour. The assertion lives in the suite rather than in a grep over
        # this step's output — measured: vitest prints a per-file line only for
        # FAILING files, so a grep for the harness file finds nothing exactly
        # when everything passed.
        env:
          TEST_DATABASE_URL: postgres://moovo:moovo@127.0.0.1:5437/postgres
          MOOVO_REQUIRE_POSTGRES_TESTS: '1'
        run: bun run --filter @moovo/backend test

      # Production runs the API on Bun (Dockerfile runner stage), so the unit
      # suite also runs under Bun's runtime and test runner, not only under
      # vitest on Node. Left on vitest only: the *.realdb suites (they hang
      # under `bun test`; the image smoke below covers Postgres under Bun) and
      # three files that re-evaluate modules with `vi.resetModules`/`vi.doMock`,
      # which bun:test cannot reproduce. Those are runner differences, not
      # runtime ones; see the `test:bun` script.
      - name: Run API unit tests under Bun
        run: bun run --filter @moovo/backend test:bun

      # Builds the API and EXECUTES the built artefacts under bun, the image's
      # runtime: each failure scenario must exit non-zero (ECS and the deploy
      # read nothing but exit codes), and a real boot, /health/ready and SIGTERM
      # must end in exit 0. The compose server's `moovo` database has PostGIS.
      - name: Check built API entrypoints under Bun
        env:
          MOOVO_ENTRYPOINT_DATABASE_URL: postgres://moovo:moovo@127.0.0.1:5437/moovo
        run: bun run check:api-entrypoints

  # The image as ECS runs it: built from the real Dockerfile and booted against
  # Postgres. Bun as PID 1, both migrator phases with the deploy's command, a
  # workload-identity token minted with the production @oxy.so/core, a 200 from
  # /health/ready and a graceful exit 0 on SIGTERM.
  #
  # linux/amd64, while production is linux/arm64: the database must be the
  # compose file's postgis/postgis image (the migrator requires PostGIS), which
  # publishes amd64 only. The deploy builds the arm64 image from the same
  # Dockerfile, and both architectures use the same oven/bun alpine (musl) base.
  api-image-smoke:
    name: API image smoke (Bun)
    needs: changes
    if: ${{ !cancelled() && !failure() && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start PostgreSQL
        run: docker compose -f docker-compose.postgres.yml up -d --wait postgres

      - name: Build the API image
        run: docker build -t moovo-api:ci .

      - name: Smoke the API image under its Bun runtime
        env:
          IMAGE: moovo-api:ci
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          DATABASE_URL: postgres://moovo:moovo@127.0.0.1:5437/moovo
        run: bash .github/scripts/smoke-api-image.sh

  build-api:
    name: Build API
    needs: changes
    if: ${{ !cancelled() && !failure() && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No cache for ~/.bun/install/cache, deliberately. Measured on #111
      # (runs 36715141012, 36720741457, 36721889380): a warm restore took
      # 7-9s plus a 3-5s install, and a save took up to 8s, against a plain
      # install of 5-14s. It never paid for itself, and each save spends
      # the repo's 10 GB Actions cache budget.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build API
        run: bun run build:backend

  build-app:
    name: Build App
    needs: changes
    if: ${{ !cancelled() && !failure() && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build App (Expo web export)
        run: bun run build:frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
